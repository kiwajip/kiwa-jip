<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIWA | Ornamental & Geometric Tattoo</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("dB0Q2cv_50XALAZq4");
        })();
    </script>
    <style>
        :root {
            --bg-color: #1a1918;
            --surface-color: #242221;
            --text-primary: #e6e2dd;
            --text-secondary: #a8a29e;
            --accent-color: #c5b358;
            --border-color: #383533;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Noto Serif KR', serif;
            line-height: 1.6;
            letter-spacing: 0.05em;
        }

        header {
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1.5rem;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        section {
            margin-bottom: 5rem;
        }

        h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: 0.15em;
            color: var(--text-primary);
        }

        /* Booking Form Styles */
        .booking-container {
            background-color: var(--surface-color);
            padding: 3rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        input, textarea {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Noto Serif KR', serif;
            font-size: 0.95rem;
            border-radius: 2px;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 1rem;
            background-color: var(--text-primary);
            color: var(--bg-color);
            border: none;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
            margin-top: 1rem;
        }

        button[type="submit"]:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .instagram-link {
            text-align: center;
            margin-top: 2rem;
        }

        .instagram-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
        }

        .instagram-link a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <header>
        <h1>KIWA</h1>
        <p>Ornamental & Geometric Tattoo Art</p>
    </header>

    <nav>
        <a href="#about">About</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#booking">Booking</a>
    </nav>

    <main>
        <!-- About Section -->
        <section id="about">
            <h2>About</h2>
            <p style="text-align: center; color: var(--text-secondary); max-width: 600px; margin: 0 auto;">
                Specializing in geometric patterns, mandalas, oriental linework, and traditional motifs. Based in Frankfurt am Main, Germany.
            </p>
        </section>

        <!-- Booking Section -->
        <section id="booking">
            <h2>Booking & Inquiry</h2>
            <div class="booking-container">
                <form id="contact-form">
                    <div class="form-group">
                        <label for="from_name">Name</label>
                        <input type="text" id="from_name" name="from_name" required placeholder="Your Name">
                    </div>

                    <div class="form-group">
                        <label for="from_email">Email</label>
                        <input type="email" id="from_email" name="from_email" required placeholder="Your Email Address">
                    </div>

                    <div class="form-group">
                        <label for="placement">Placement (시술 부위)</label>
                        <input type="text" id="placement" name="placement" required placeholder="e.g., Forearm, Back">
                    </div>

                    <div class="form-group">
                        <label for="size">Estimated Size (예상 사이즈)</label>
                        <input type="text" id="size" name="size" required placeholder="e.g., 15cm x 10cm">
                    </div>

                    <div class="form-group">
                        <label for="message">Idea & Details (작업 아이디어 및 디테일)</label>
                        <textarea id="message" name="message" required placeholder="Describe your concept, reference style, or ideas..."></textarea>
                    </div>

                    <button type="submit">Send Inquiry</button>
                </form>

                <div class="instagram-link">
                    <p>Or direct message via Instagram: <a href="https://www.instagram.com/kiwa_jip" target="_blank">@kiwa_jip</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 KIWA. All Rights Reserved.</p>
    </footer>

    <!-- EmailJS Submission Logic -->
    <script>
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();

            // EmailJS 전송 실행 (Service ID, Template ID, Form 객체)
            emailjs.sendForm('service_kiwa', 'template_ahfvhka', this)
                .then(function() {
                    alert('예약 문의가 성공적으로 전송되었습니다! 빠른 시일 내에 답변 드리겠습니다.');
                    document.getElementById('contact-form').reset(); // 폼 초기화
                }, function(error) {
                    alert('전송에 실패했습니다. 다시 시도해 주세요. (Error: ' + JSON.stringify(error) + ')');
                });
        });
    </script>
</body>
</html>
